services:
  - type: web
    name: job-automator
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx playwright install chromium && apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PW_HEADLESS
        value: "true"
      - key: PORT
        value: "3000"
