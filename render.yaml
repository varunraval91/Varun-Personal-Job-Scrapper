services:
  - type: web
    name: job-automator
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx playwright install chromium
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PW_HEADLESS
        value: "true"
      - key: PORT
        value: "3000"
